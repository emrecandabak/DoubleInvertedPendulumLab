name: Build and verify simulator
on:
  push:
  pull_request:
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test DipLabSim.Numerics.Tests -c Release
  windows-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build DoubleInvertedPendulumLab.slnx -c Release
      - run: dotnet test DipLabSim.Tests -c Release --no-build
      - run: dotnet publish DipLabSim.UI -c Release -r win-x64 --self-contained true -o artifacts/DipLabSim
      - uses: actions/upload-artifact@v4
        with:
          name: DipLabSim-Windows-x64
          path: artifacts/DipLabSim/
